overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.1

trustPolicy: no-downgrade

# postcss/@babel が引く正規の deep transitive 依存。provenance 不足による誤検知のため、
# この特定バージョンのみ trust チェックから除外する（将来の別バージョンは引き続き検証対象）。
trustPolicyExclude:
  - "nanoid@3.3.14"
  - "semver@6.3.1"
  # react-email@6.6.8 CLI が引く chokidar。特定バージョンのみ除外し、将来版は検証対象に残す。
  - "chokidar@4.0.3"

onlyBuiltDependencies:
  - esbuild

# 公開直後の侵害された可能性のあるリリースを避けるため、公開から1日（1440分）経過したバージョンのみ許可する
minimumReleaseAge: 1440

# Issue #17 で一次資料・tarball・型定義まで確認した採用版と、CIで利用するReact Doctorの
# 特定バージョンだけを公開待機期間から除外する。将来版は引き続きminimumReleaseAgeの対象。
minimumReleaseAgeExclude:
  - "@tanstack/charts@0.7.2"
  - "@tanstack/charts-scales@0.7.2"
  - "@tanstack/react-charts@0.7.2"
  - "deslop-js@0.9.7"
  - "oxlint-plugin-react-doctor@0.9.7"
  - "react-doctor@0.9.7"

allowBuilds:
  esbuild: true
  msgpackr-extract: false

patchedDependencies:
  garmin-connect-sdk: patches/garmin-connect-sdk.patch
